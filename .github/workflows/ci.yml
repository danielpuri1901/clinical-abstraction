name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    # Lint, then replay every deterministic check on the frozen extractions. No model calls, no secrets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: Replay the saved answers without a model
        run: uv run abstraction verify-answers

  image:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: clinical-abstraction:${{ github.sha }}
